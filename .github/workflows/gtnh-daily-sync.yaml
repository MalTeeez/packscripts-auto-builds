name: Sync GTNH Daily Builds

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
      run_number:
        type: string
        required: true

permissions:
  contents: write # push commit

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out gtnh-daily branch
        uses: actions/checkout@v5
        with:
          ref: gtnh-daily
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # needed for tagging
          submodules: true

      - name: Download pack zip artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/gtnh-client /tmp/gtnh-server

          client_id=$(gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/runs/${{ inputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | contains("mmcprism-java17")) | .id')
          gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/artifacts/${client_id}/zip" \
            > /tmp/gtnh-client/artifact.zip

          server_id=$(gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/runs/${{ inputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | contains("server-java17")) | .id')
          gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/artifacts/${server_id}/zip" \
            > /tmp/gtnh-server/artifact.zip

      - name: Clear current state
        run: |
          rm -rf .minecraft libraries patches gtnh_icon.png instance.cfg mmc-pack.json
          find packaging/server -maxdepth 1 \
            ! -path packaging/server \
            ! -name 'unsup' \
            ! -name 'unsup.ini' \
            -exec rm -rf {} +

      - name: Unpack client artifact & update current state from it
        run: |
          mkdir -p /tmp/gtnh-client-unpacked
          unzip -o /tmp/gtnh-client/artifact.zip -d /tmp/gtnh-client-unpacked/

          inner_dir=$(find /tmp/gtnh-client-unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)
          chmod -R u+rX "$inner_dir"
          cp -r "$inner_dir/." .

      - name: Unpack server artifact
        run: |
          mkdir -p /tmp/gtnh-server-unpacked
          unzip -o /tmp/gtnh-server/artifact.zip -d /tmp/gtnh-server-unpacked/
          chmod -R u+rX /tmp/gtnh-server-unpacked

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run client pass
        working-directory: packscripts
        env:
          PACKSCRIPTS_IS_LIMITED_ENV: 1
          PACKSCRIPTS_GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun main refresh --toggle_tag SIDE.CLIENT

      - name: Stage server artifact
        run: |
          mkdir -p packaging/server
          find /tmp/gtnh-server-unpacked -maxdepth 1 ! -path /tmp/gtnh-server-unpacked \
            \( -type f -o -name "libraries" \) \
            ! -name "changelog from daily * to *.md" \
            | xargs -I{} mv {} packaging/server/

          # Merge remaining server dirs (config, journeymap, etc.) into .minecraft, excluding mods (since me merge that later)
          find /tmp/gtnh-server-unpacked -maxdepth 1 ! -path /tmp/gtnh-server-unpacked \
            ! -name "mods" -type d \
            | xargs -I{} cp -r --update=none {} .minecraft/

      - name: Swap mods folder for server pass
        run: |
          mv .minecraft/mods /tmp/gtnh-client-mods
          cp -r /tmp/gtnh-server-unpacked/mods .minecraft/mods

      - name: Run server pass
        working-directory: packscripts
        env:
          PACKSCRIPTS_IS_LIMITED_ENV: 1
          PACKSCRIPTS_GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun main refresh --remove_untagged SIDE. --toggle_tag SIDE.SERVER

      - name: Merge mods folders from both variants
        run: cp -r --update=none /tmp/gtnh-client-mods/. .minecraft/mods/

      - name: Attach unsup launcher to server start
        run: |
          cp packaging/server/java9args.txt packaging/server/java9args_default.txt
          printf '%s\n' \
            "-javaagent:unsup-launcher.jar" \
            "-Dunsup.debug=false" \
            "-Dunsup.downloadWorkers=8" \
            "-Dunsup.versionSelectorOnLaunch=false" \
            >> packaging/server/java9args.txt

      - name: Update direct links
        working-directory: packscripts
        env:
          PACKSCRIPTS_IS_LIMITED_ENV: 1
          PACKSCRIPTS_GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun main version verify_links

      - name: Auto-enroll large files in Git LFS
        run: |
          git lfs install
          rm -f .gitattributes
          find . -mindepth 1 \
            ! -path './.git*' \
            ! -path './packscripts*' \
            -size +10M \
            | xargs -I{} git lfs track "{}"

      - name: Commit pack snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync GTNH daily-${{ inputs.run_number }} (DAXXL run ${{ inputs.run_id }})"
          git tag "daily-${{ inputs.run_number }}"
          git push origin gtnh-daily
          git push origin "daily-${{ inputs.run_number }}"

      - name: Generate version manifests with packscripts
        working-directory: packscripts
        env:
          PACKSCRIPTS_IS_LIMITED_ENV: 1
        run: |
          bun main package build -t daily-${{ inputs.run_number }}
          bun main package bundle

      - name: Auto-enroll large files in Git LFS
        run: |
          rm -f .gitattributes
          find . -mindepth 1 \
            ! -path './.git*' \
            ! -path './packscripts*' \
            -size +10M \
            | xargs -I{} git lfs track "{}"

      - name: Commit generated manifests
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: version manifests for daily-${{ inputs.run_number }}"
          git push origin gtnh-daily

      - name: Trigger Image Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | # We have to do this manually, since this workflow was already triggered via API using the GH token
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gtnh-daily-image.yaml/dispatches"