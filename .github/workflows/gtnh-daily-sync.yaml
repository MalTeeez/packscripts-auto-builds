name: Sync GTNH Daily Builds

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
      run_number:
        type: string
        required: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out gtnh-daily branch
        uses: actions/checkout@v4
        with:
          ref: gtnh-daily
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # needed for tagging
          submodules: true

      - name: Download Prism zip artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/gtnh-artifact
          artifact_id=$(gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/runs/${{ inputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | contains("mmcprism-new-java")) | .id')
          gh api \
            "repos/GTNewHorizons/DreamAssemblerXXL/actions/artifacts/${artifact_id}/zip" \
            > /tmp/gtnh-artifact/artifact.zip

      - name: Unpack artifact
        run: |
          # Outer artifact zip -> inner pack zip
          unzip -o /tmp/gtnh-artifact/artifact.zip -d /tmp/gtnh-artifact/
          pack_zip=$(find /tmp/gtnh-artifact -name "*.zip" | head -n1)

          # Inner pack zip -> contents (has "GT New Horizons daily/" at root)
          unzip -o "$pack_zip" -d /tmp/gtnh-unpacked/
          inner_dir=$(find /tmp/gtnh-unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)

          echo "inner_dir: $inner_dir"
          ls "$inner_dir"

          # Clear existing pack contents, preserve repo files
          find . -mindepth 1 \
            ! -path './.git*' \
            ! -path './.github*' \
            ! -path './packscripts*' \
            -delete

          cp -r "$inner_dir"/. .

      - name: Auto-enroll large files in Git LFS
        run: |
          git lfs install
          rm -f .gitattributes
          find . -mindepth 1 \
            ! -path './.git*' \
            ! -path './packscripts*' \
            -size +10M \
            | sed 's|.*\.\([^.]*\)$|\1|' \
            | sort -u \
            | xargs -I{} git lfs track "*.{}"

      - name: Commit pack snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync GTNH daily-${{ inputs.run_number }} (DAXXL run ${{ inputs.run_id }})"
          git tag "daily-${{ inputs.run_number }}"
          git push origin gtnh-daily
          git push origin "daily-${{ inputs.run_number }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run packscripts bootstrap
        working-directory: packscripts
        run: bun main package bootstrap

      - name: Commit generated manifests
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: bootstrap manifests for daily-${{ inputs.run_number }}"
          git push origin gtnh-daily

      - name: Update last processed run number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_RUN_NUMBER --body "${{ inputs.run_number }}"