name: Build & Deploy GTNH Daily CI image

on:
  workflow_run:
    workflows: ["Sync GTNH Daily Builds"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/malteeez/gtnh-daily

jobs:
  build-and-deploy-image:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gtnh-daily
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Split mods into buckets
        working-directory: packscripts
        env:
          PACKSCRIPTS_IS_LIMITED_ENV: 1
          PACKSCRIPTS_GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun main package image Dockerfile.run mods/ --include_tag SIDE.SERVER

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest gtnh-daily git tag
        id: gittag
        run: |
          git fetch --tags
          TAG=$(git tag --list 'daily-*' --sort=-version:refname | head -n1)
          echo "value=${TAG:-latest}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.run
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.gittag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
