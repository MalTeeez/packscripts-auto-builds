name: Poll GTNH Daily Builds


on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # every hour
    
permissions:
  actions: write

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for new DAXXL runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/GTNewHorizons/DreamAssemblerXXL/actions/workflows/daily-modpack-build.yml/runs?status=success&per_page=1" \
            | jq '.workflow_runs[0] | {id: .id, run_number: .run_number}')

          run_id=$(echo "$latest" | jq -r '.id')
          run_number=$(echo "$latest" | jq -r '.run_number')
          last_processed=$(gh api "repos/${{ github.repository }}/git/refs/tags" \
            --jq '[.[] | select(.ref | startswith("refs/tags/daily-")) | .ref | ltrimstr("refs/tags/daily-")] | map(tonumber) | max // 0')

          echo "Latest run: #$run_number (id: $run_id)"
          echo "Last processed: #$last_processed"

          if [ "$run_number" -le "$last_processed" ]; then
            echo "Nothing to do."
            exit 0
          fi

          echo "Triggering sync for run #$run_number"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gtnh-daily-sync.yaml/dispatches" \
            -d "{\"ref\":\"gtnh-daily\",\"inputs\":{\"run_id\":\"$run_id\",\"run_number\":\"$run_number\"}}"