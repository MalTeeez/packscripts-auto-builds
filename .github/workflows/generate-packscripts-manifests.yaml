name: Generate Packscripts Manifests

on:
  push:
    tags:
      - '**'

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # - name: Run packscripts bootstrap
      #   working-directory: packscripts
      #   run: bun main package bootstrap

      - name: Run packscripts build
        working-directory: packscripts
        run: bun main package build -t "${{ github.ref_name }}"

      - name: Commit generated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there's anything new
          git diff --cached --quiet || git commit -m "chore: generate manifests for ${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}